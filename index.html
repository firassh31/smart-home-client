<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script>
        // Device router: phones/tablets get the mobile app at /m, desktops stay here.
        // Escape hatches: ?view=web forces the desktop UI, ?view=mobile forces /m.
        (function () {
            try {
                var params = new URLSearchParams(location.search);
                var view = params.get('view');
                if (view === 'web') { localStorage.setItem('mshome-force-web', '1'); return; }
                if (view === 'mobile') { localStorage.removeItem('mshome-force-web'); location.replace('/m/'); return; }
                if (localStorage.getItem('mshome-force-web') === '1') return;
                var isMobile = (navigator.userAgentData && navigator.userAgentData.mobile) ||
                    /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                    (/Mac/.test(navigator.userAgent) && navigator.maxTouchPoints > 1); // iPadOS reports as Mac
                if (isMobile) location.replace('/m/');
            } catch (e) { /* no redirect on error — desktop UI still works */ }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MSHome</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div id="auth-page" class="auth-overlay">
        <div class="modal-content auth-box">
            <a href="dashboard.html" class="auth-logo" style="text-decoration: none;">
                <span class="brand-mark">MS</span>
                <span class="brand-text">MSHome</span>
            </a>
            <h3>Login</h3>
            <p class="modal-subtitle">Manage your smart devices securely.</p>

            <form id="auth-form">
                <div class="input-group" id="auth-name-group">
                    <label for="auth-name">Username, Email or Phone</label>
                    <input type="text" id="auth-name" placeholder="e.g. john@mshome.com" required>
                </div>
                <div class="input-group">
                    <label for="auth-password">Password</label>
                    <input type="password" id="auth-password" placeholder="Minimum 6 characters" required>
                </div>

                <p id="auth-message" class="auth-msg-text"></p>
                <button type="submit" id="auth-submit-btn" class="primary-btn btn-on full-width-btn">Sign In</button>

                <p class="auth-toggle-wrapper">
                    <span id="auth-toggle-text">Don't have an account?</span>
                    <a href="register.html">Register here</a>
                </p>
            </form>
        </div>
    </div>
    <script src="/js/main.js" defer></script>
</body>

</html>
